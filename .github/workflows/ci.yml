name: CI

# Prose-only changes skip CI, but the DocC catalogue under
# Sources/**/*.docc is compiled, not prose — a broken symbol link or a
# malformed directive there is a build failure. So ignore only the
# top-level narrative files rather than every `.md` in the tree.
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: macOS tests + iOS lifecycle tests
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Input configuration API guard
        run: ./bin/check-input-configuration-api.sh

      # Full test run on the macOS 27 host.
      # This is the suite that gates correctness.
      - name: SwiftPM tests (macOS host)
        run: xcrun swift test --package-path .

      # Compile every iOS test, then run the hardware-independent migration
      # suites. Microphone and route behavior still need device validation.
      - name: iOS Simulator build (compile-only)
        run: |
          xcodebuild build-for-testing \
            -scheme swift-audio-io-Package \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -skipPackagePluginValidation

      - name: iOS lifecycle and cancellation tests
        run: |
          xcodebuild test-without-building \
            -scheme swift-audio-io-Package \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -only-testing:AIOTests/RecordingCancellationTests \
            -only-testing:AIOTests/RecordingStartReadinessTests \
            -only-testing:AIOTests/AudioSessionActivationTests \
            -only-testing:AIOTests/ReadOnlyBufferBridgeTests \
            -only-testing:ToolsTests/CancellationOperationTests \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -skipPackagePluginValidation

      # Compiles Sources/AudioIO/AudioIO.docc. Catches malformed directives
      # and a dropped catalogue, which is how the articles silently rotted
      # before: nothing built them.
      #
      # `--warnings-as-errors` is NOT on yet. The build currently emits ~126
      # "X is ambiguous at '/AudioIO'" warnings, because every symbol
      # re-exported through Exports.swift is visible twice — once as the
      # original and once as the curated `public typealias`. That is a
      # packaging problem, not a docs problem; turn this flag on once the
      # umbrella target stops mirroring symbols.
      - name: DocC build
        run: |
          xcrun swift package --allow-writing-to-directory "$RUNNER_TEMP/docs" \
            generate-documentation --target AudioIO \
            --output-path "$RUNNER_TEMP/docs"
